# docker compose for the bench pipeline.
#
#   cp .env.example .env      # then edit .env (DATASET, AGENT_MODEL, MODEL_NAME + a key)
#
#   docker compose up run      # steps 1-4: dataset -> workspace -> agent -> predictions
#   docker compose up eval     # step 5: evaluate the newest predictions (needs Docker)
#   docker compose up report   # summarize the newest report
#
# `eval` and `report` sit behind the "eval" profile: naming the service on the
# command line activates its profile automatically, so the three commands above
# just work, while a bare `docker compose up` still only runs `run`.
#
# Full CLI passthrough for anything else:
#   docker compose run --rm run list --limit 10
#   docker compose run --rm run --skip 10 --limit 5
name: bench

x-common-env: &common-env
  # From .env (the only knobs that live there):
  DATASET: ${DATASET:-}
  AGENT_MODEL: ${AGENT_MODEL:-}
  MODEL_NAME: ${MODEL_NAME:-}
  LIMIT: ${LIMIT:-0}
  # Optional overrides, ad hoc: `AGENT_TIMEOUT=300 docker compose up run`
  SKIP: ${SKIP:-0}
  AGENT: ${AGENT:-pi}
  AGENT_TIMEOUT: ${AGENT_TIMEOUT:-1800}
  AGENT_EXTRA_ARGS: ${AGENT_EXTRA_ARGS:-}
  EVAL_WORKERS: ${EVAL_WORKERS:-4}
  HF_HOME: /root/.cache/huggingface

services:
  # ---- Steps 1-4: dataset -> workspace -> agent -> predictions.jsonl ---------
  run:
    build:
      context: .
      target: base
      args:
        PI_VERSION: ${PI_VERSION:-latest}
    image: bench:latest
    init: true
    environment:
      <<: *common-env
      PIPELINE_CMD: run
    env_file:
      # Optional: carries credentials (e.g. provider API keys). Missing file is fine.
      - path: .env
        required: false
    volumes:
      # Pipeline output persists on the host (predictions.jsonl, manifest, logs).
      - ./runs:/app/runs
      # Pi home dir (~/.pi). Pi resolves its config at ~/.pi/agent, so mount the
      # home (not the agent subdir) and models.json / auth.json land correctly.
      - ${PI_HOME:-./.pi-home}:/root/.pi
      # Live pipeline sources (see x-src-mounts) + the HF dataset cache.
      - ./src/run_bench.py:/app/run_bench.py:ro
      - ./src/pi_logging.py:/app/pi_logging.py:ro
      - ./src/benchmarks:/app/benchmarks:ro
      - hf-cache:/root/.cache/huggingface

  # ---- Step 5: evaluation via the benchmark's harness -----------------------
  # (needs a reachable Docker daemon; auto-detects the newest predictions.jsonl)
  eval:
    profiles: ["eval"]
    build:
      context: .
      target: swebench
      args:
        PI_VERSION: ${PI_VERSION:-latest}
    image: bench:eval
    init: true
    environment:
      <<: *common-env
      PIPELINE_CMD: evaluate
    env_file:
      - path: .env
        required: false
    volumes:
      - ./runs:/app/runs
      # The harness writes logs/run_evaluation/<run_id>.*/report.json here.
      - ./logs:/app/logs
      # The harness builds & runs per-instance images, so it needs the daemon.
      # On Docker Desktop this socket is available inside containers as-is.
      - /var/run/docker.sock:/var/run/docker.sock
      - ./src/run_bench.py:/app/run_bench.py:ro
      - ./src/pi_logging.py:/app/pi_logging.py:ro
      - ./src/benchmarks:/app/benchmarks:ro
      - hf-cache:/root/.cache/huggingface

  # ---- Summarize a harness report (reads the newest logs/ report) -----------
  report:
    profiles: ["eval"]
    build:
      context: .
      target: base
      args:
        PI_VERSION: ${PI_VERSION:-latest}
    image: bench:latest
    init: true
    environment:
      <<: *common-env
      PIPELINE_CMD: report
    env_file:
      - path: .env
        required: false
    volumes:
      - ./logs:/app/logs
      - ./src/run_bench.py:/app/run_bench.py:ro
      - ./src/pi_logging.py:/app/pi_logging.py:ro
      - ./src/benchmarks:/app/benchmarks:ro

volumes:
  hf-cache:
